<div id="document-tab" style="display: none">
  <!-- Lists of district & towns for autocomplete/suggestion -->
  <datalist id="districts-cities">
    {% for (district, province) in district_province.items() %}
    <option data-province="{{ province }}" name="{{ district }}" value="{{ district }}">
    {% endfor %}
    {% for (city, province) in city_province.items() %}
    <option data-province="{{ province }}" name="{{ city }}" value="{{ city }}">
    {% endfor %}
  </datalist>

  <datalist id="towns">
    {% for town in towns.town.unique() %}
    <option value="{{ town }}">
    {% endfor %}
  </datalist>

  <div id="document-container">
    <img id="document-image-display"/>
    <canvas id="document-overlay-canvas"></canvas>
  </div>
  <div id="document-inputs">
    <p>{{ _('Enter the document metadata. Select the document type by clicking the header below.') }}</p>
    <table>
      <tr>
        <td>
          <label>
            {{ _('Document type:') }}
            <select id="document-type" onchange="updateHeader()">
              <option value=""></option>
              <option value="anopheles_funestus">{{ _('Anopheles Funestus') }}</option>
              <option value="anopheles_funestus_s.1_compact">{{ _('Anopheles Funestus s.1 (Compact)') }}</option>
              <option value="anopheles_gambia_s.1">{{ _('Anopheles Gambiae s.1') }}</option>
              <option value="anopheles_gambia_s.1_compact">{{ _('Anopheles Gambiae s.1 (Compact)') }}</option>
              <option value="anopheles_gambia_s.1_widecol">{{ _('Anopheles Gambiae s.1 (Wide columns)') }}</option>
              <option value="other_anopheles">{{ _('Other Anopheles') }}</option>
              <option value="other_anopheles_compact">{{ _('Other Anopheles (Compact)') }}</option>
              <option value="other_vectors">{{ _('Other vectors') }}</option>
              <option value="other_vectors_compact">{{ _('Other vectors (Compact)') }}</option>
              <option value="procopack">{{ _('Procopack/Manual collection') }}</option>
              <option value="light_traps_indoor_outdoor">{{ _('Light traps (Indoor and outdoor)') }}</option>
              <option value="other_vectors_disease_a">{{ _('Other disease vectors (Type A)') }}</option>
              <option value="other_vectors_disease_b">{{ _('Other disease vectors (Type B)') }}</option>
              <option value="other_vectors_disease_c">{{ _('Other disease vectors (Type C)') }}</option>
              <option value="other_vectors_disease_d">{{ _('Other disease vectors (Type D)') }}</option>
            </select>
          </label>
        </td>
        <td>
          {% include 'identify-document.html' %}
        </td>
      </tr>
      <tr>
        <td>
          <label>
            {{ _('Province:') }}
            <select id="document-province" aria-label="{{ _('Province') }}">
              <option value=""></option>
              {% for province in provinces %}
              <option value="{{ province }}">{{ province }}</option>
              {% endfor %}
            </select>
          </label>
        </td>
        <td>
          <label>
            {{ _('District/Municipality:') }}
            <input id="document-district-city" placeholder="{{ _('District/Municipality') }}" oninput="updateProvince()" list="districts-cities"/>
          </label>
        </td>
      </tr>
      <tr>
        <td>
          <label>
            {{ _('Locality/Village 1:') }}
            <input id="document-locality-1" placeholder="{{ _('Locality 1') }}" list="towns"/>
          </label>
        </td>
        <td>
          <label>
            {{ _('Neighborhood 1:') }}
            <input type="text" id="document-neighborhood-1" placeholder="{{ _('Neighborhood 1') }}"/>
          </label>
        </td>
      </tr>
      <tr>
        <td>
          <label>
            {{ _('Locality/Village 2:') }}
            <input id="document-locality-2" placeholder="{{ _('Locality 2') }}" list="towns"/>
          </label>
        </td>
        <td>
          <label>
            {{ _('Neighborhood 2:') }}
            <input type="text" id="document-neighborhood-2" placeholder="{{ _('Neighborhood 2') }}"/>
          </label>
        </td>
      </tr>
      <tr>
        <td>
          <label>
            {{ _('Collection date:') }}
            <input type="date" id="document-collection-date" aria-label="{{ _('Collection date') }}"/>
          </label>
        </td>
        <td>
          <label>
            {{ _('Spraying month/year:') }}
            <input type="text" id="document-year-sprayed" placeholder="{{ _('Spraying month/year') }}"/>
          </label>
        </td>
      </tr>
    </table>
    <button class="btn btn-primary" id="document-submit-btn">{{ _('Submit document information') }}</button>
  </div>
</div>
